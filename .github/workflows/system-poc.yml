name: Linux system boot proof

on:
  push:
    branches: [main, zupi-004-linux-qemu-poc]
    paths:
      - ".github/workflows/system-poc.yml"
      - "tests/system-poc/**"
  pull_request:
    paths:
      - ".github/workflows/system-poc.yml"
      - "tests/system-poc/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-kernel-initramfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install kernel and emulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes linux-image-generic busybox-static cpio gzip qemu-system-x86 coreutils
      - name: Verify selected kernel and tools
        run: |
          # Ubuntu's packaged kernel may be root-readable only (mode 0600).
          sudo chmod a+r /boot/vmlinuz-*
          ls -lh /boot/vmlinuz-*
          busybox | head -n 1
          qemu-system-x86_64 --version
          {
            echo "SYSTEM_POC_RUNNER_IMAGE=ubuntu-24.04"
            echo "SYSTEM_POC_KERNEL_PACKAGES:"
            dpkg-query -W -f='${binary:Package}=${Version}\n' 'linux-image-*' busybox-static cpio gzip qemu-system-x86 coreutils 2>/dev/null || true
            echo "SYSTEM_POC_KERNEL_FILES:"
            for kernel in /boot/vmlinuz-*; do
              [ -f "$kernel" ] || continue
              printf '%s bytes=' "$(basename "$kernel")"
              wc -c < "$kernel"
            done
            echo "SYSTEM_POC_QEMU_VERSION:"
            qemu-system-x86_64 --version | head -n 1
            echo "SYSTEM_POC_BUSYBOX_VERSION:"
            busybox | head -n 1
          } > "$RUNNER_TEMP/zupios-system-poc-manifest.txt"
      - name: Boot Linux kernel with minimal initramfs in QEMU
        run: bash tests/system-poc/run.sh 2>&1 | tee "$RUNNER_TEMP/zupios-system-poc-run.log"
      - name: Upload system boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zupios-system-boot-evidence
          path: |
            ${{ runner.temp }}/zupios-system-poc-manifest.txt
            ${{ runner.temp }}/zupios-system-poc-run.log
          if-no-files-found: warn
          retention-days: 14
