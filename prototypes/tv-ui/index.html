<body><div id="boot-screen" class="boot-screen" hidden aria-label="ZupiOS"><div class="boot-logo">Zupi<span class="boot-os">OS</span></div></div><div class="shell">
<header>

  <div class="top-meta"><span id="clock" class="clock" aria-label="Horário atual">--:--</span><button class="profile-chip" data-action="edit-active-profile" id="profile-button" aria-label="Editar perfil atual"><span class="profile-avatar" id="header-avatar" aria-hidden="true">🙂</span><span class="profile-name" id="header-profile-name">Principal</span></button><button class="header-settings" data-action="settings" aria-label="Configurações" title="Configurações"><svg class="glyph-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19 15l2 1-2 4-2-1-2 1v2h-5v-2l-2-1-2 1-2-4 2-1v-2l-2-1 2-4 2 1 2-1V6h5v2l2 1 2-1 2 4-2 1z"/></svg></button></div>
</header>

</div>
<script>
(() => {
const APP_VERSION='0.7.0-prototype';
const EDITION='Premium'; // Mudar para 'Base' para ocultar a faixa dourada nesta demonstração.
const PROFILES=[{name:'Principal',avatar:'🙂',pin:'',child:false},{name:'Convidado',avatar:'🦊',pin:'',child:false}];
const AVATARS=['🙂','🦊','🐼','🐱','🦉','🐸','🐻','🐧','🦁','🐰'];
const MAX_SHORTCUTS=7;
const SHORTCUT_CATALOG=[{id:'media',name:'Mídia',glyph:'play',kind:'Aplicativo',action:'media'},{id:'weather',name:'Clima',glyph:'weather',kind:'Widget',action:'widget-weather'},{id:'calendar',name:'Calendário',glyph:'calendar',kind:'Widget',action:'widget-calendar'},{id:'marketplace',name:'Marketplace',glyph:'market',kind:'Serviço',action:'marketplace'},{id:'demo',name:'App de exemplo',glyph:'app',kind:'Aplicativo',action:'open-demo'},{id:'music',name:'Música',glyph:'music',kind:'Aplicativo',action:'media'},{id:'photos',name:'Fotos',glyph:'photos',kind:'Aplicativo',action:'media'}];
const app=document.querySelector('#app'),toast=document.querySelector('#toast');
let screen=new URLSearchParams(window.location.search).get('experience')==='tv'?'profiles':'home',selected=0,network=true,reducedMotion=false,sound=true,profileIndex=0,pendingProfileIndex=0,editingAvatar='🙂',tuner='digital',shortcuts=['media','weather'],shortcutCursor=0,homeLayout=0;
const HOME_LAYOUTS=['Equilibrado','Compacto','Atalhos em destaque'];
document.querySelector('#version').textContent='v'+APP_VERSION;
const iconPaths={"tv":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"m8 2 4 3 4-3M8 22h8m-4-4v4\"/>","apps":"<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>","play":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"/><path d=\"m10 8 6 4-6 4z\"/>","settings":"<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19 15l2 1-2 4-2-1-2 1v2h-5v-2l-2-1-2 1-2-4 2-1v-2l-2-1 2-4 2 1 2-1V6h5v2l2 1 2-1 2 4-2 1z\"/>","help":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.6 9a2.5 2.5 0 1 1 4.1 1.9c-1.1.9-1.7 1.2-1.7 2.6m0 3h.01\"/>","plus":"<path d=\"M12 5v14M5 12h14\"/>","weather":"<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/>","calendar":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M16 3v4M8 3v4M3 10h18m-13 4h2m3 0h2m-7 3h2\"/>","market":"<path d=\"M3 9h18l-2-6H5L3 9Zm2 0v12h14V9M9 21v-7h6v7\"/>","app":"<path d=\"m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5\"/>","music":"<path d=\"M9 18V5l12-2v13\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><circle cx=\"18\" cy=\"16\" r=\"3\"/>","photos":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/><path d=\"m21 15-5-5L5 21\"/>"};
const icon=name=>'<svg class=\"glyph-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">'+(iconPaths[name]||iconPaths.app)+'</svg>';

document.querySelector('#premium-band').hidden=EDITION.toLowerCase()!=='premium';
const items=()=>[...app.querySelectorAll('button:not(:disabled),input:not(:disabled)')],announce=m=>toast.textContent=m,home=()=>go('home'),escapeHTML=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function updateClock(){const now=new Date();document.querySelector('#clock').textContent=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(now)}
function scheduleClock(){const now=new Date();setTimeout(()=>{updateClock();scheduleClock()},(60-now.getSeconds())*1000-now.getMilliseconds()+20)}
updateClock();scheduleClock();
function go(s){screen=s;selected=0;render()}
function btn(label,action,cls=''){return '<button class="'+cls+'" data-action="'+action+'">'+label+'</button>'}
function focusSelected(){const a=items();if(a.length){selected=Math.max(0,Math.min(selected,a.length-1));a[selected].focus({preventScroll:screen!=='profile-manage'})}}
function findDirectionalIndex(elements,currentIndex,direction){if(currentIndex<0||currentIndex>=elements.length)return Math.max(0,Math.min(currentIndex,elements.length-1));const rect=el=>el.getBoundingClientRect(),origin=rect(elements[currentIndex]),cx=(origin.left+origin.right)/2,cy=(origin.top+origin.bottom)/2;let best=currentIndex,bestScore=Infinity;for(let i=0;i<elements.length;i++){if(i===currentIndex)continue;const r=rect(elements[i]),x=(r.left+r.right)/2,y=(r.top+r.bottom)/2,dx=x-cx,dy=y-cy,primary=direction==='right'?dx:direction==='left'?-dx:direction==='down'?dy:-dy;if(primary<=1)continue;const secondary=direction==='right'||direction==='left'?Math.abs(dy):Math.abs(dx),score=primary+secondary*2.4+(secondary>primary?secondary*1.5:0);if(score<bestScore){bestScore=score;best=i}}return best}
function render(){
document.body.classList.toggle('reduce-motion',reducedMotion);
document.body.classList.toggle('home-view',screen==='home');
document.body.classList.toggle('profile-manage-mode',screen==='profile-manage');
document.body.classList.toggle('profile-picker-mode',screen==='profiles'&&new URLSearchParams(window.location.search).get('experience')==='tv');

function act(a){
if(a.startsWith('open-profile-')){const i=Number(a.split('-').pop());if(!PROFILES[i])return;profileIndex=i;editingAvatar=PROFILES[i].avatar;if(PROFILES[i].pin){pendingProfileIndex=i;go('profile-unlock')}else go('home');return}
if(a.startsWith('select-profile-')){const i=Number(a.slice(15));if(!PROFILES[i])return;if(screen==='profile-manage'){profileIndex=i;editingAvatar=PROFILES[i].avatar;render();return}profileIndex=i;if(PROFILES[i].pin){pendingProfileIndex=i;go('profile-unlock')}else go('home');return}
if(a.startsWith('edit-profile-')){const i=Number(a.slice(13));if(!PROFILES[i])return;profileIndex=i;editingAvatar=PROFILES[i].avatar;render();return}
if(a.startsWith('avatar-')){const avatar=AVATARS[Number(a.slice(7))];if(!avatar)return;if(screen==='profile-manage'){const draft={name:document.querySelector('#profile-name-input')?.value,pin:document.querySelector('#profile-pin-input')?.value,confirm:document.querySelector('#profile-pin-confirm')?.value,child:document.querySelector('#profile-child-input')?.checked};editingAvatar=avatar;render();if(draft.name!==undefined)document.querySelector('#profile-name-input').value=draft.name;if(draft.pin!==undefined)document.querySelector('#profile-pin-input').value=draft.pin;if(draft.confirm!==undefined)document.querySelector('#profile-pin-confirm').value=draft.confirm;if(draft.child!==undefined)document.querySelector('#profile-child-input').checked=draft.child}else{PROFILES[profileIndex].avatar=avatar;render()}return}
if(a.startsWith('delete-profile-')){const i=Number(a.slice(15));if(PROFILES.length<=1){announce('É necessário manter pelo menos um perfil.');return}if(!PROFILES[i]||!window.confirm('Excluir o perfil '+PROFILES[i].name+'?'))return;PROFILES.splice(i,1);profileIndex=Math.max(0,Math.min(profileIndex,PROFILES.length-1));editingAvatar=PROFILES[profileIndex].avatar;announce('Perfil excluído.');render();return}
switch(a){
case'edit-active-profile':editingAvatar=PROFILES[profileIndex].avatar;go('profile-manage');break;
case'create-profile':if(PROFILES.length>=6){announce('Limite de seis perfis atingido.');return}PROFILES.push({name:'Novo perfil',avatar:'🙂',pin:'',child:false});profileIndex=PROFILES.length-1;editingAvatar=PROFILES[profileIndex].avatar;go('profile-manage');break;
case'unlock-profile':{const entered=document.querySelector('#unlock-pin-input')?.value||'';if(entered===PROFILES[pendingProfileIndex]?.pin){profileIndex=pendingProfileIndex;editingAvatar=PROFILES[profileIndex].avatar;go('home')}else{announce('PIN incorreto. Tente novamente.');document.querySelector('#unlock-pin-input')?.focus()}break}

case'home':home();break;case'tv':go('tv');break;case'settings':go('settings');break;case'apps':go('apps');break;case'media':go('media');break;case'recovery':go('recovery');break;case'about':go('about');break;
case'profiles':go('profiles');break;
case'add-shortcut':{if(shortcuts.length>=MAX_SHORTCUTS){announce('Limite de '+MAX_SHORTCUTS+' atalhos atingido.');break}const available=SHORTCUT_CATALOG.filter(x=>!shortcuts.includes(x.id));if(!available.length){announce('Todos os atalhos disponíveis já foram adicionados.');break}const item=available[shortcutCursor%available.length];shortcutCursor++;shortcuts.push(item.id);announce('Atalho adicionado: '+item.name+'.');render();break}
case'select-profile-0':case'select-profile-1':profileIndex=Number(a.slice(-1));announce('Perfil ativo: '+PROFILES[profileIndex].name+'.');if(screen==='profile-edit')render();else go('home');break;
case'avatar-0':case'avatar-1':case'avatar-2':case'avatar-3':case'avatar-4':case'avatar-5':case'avatar-6':case'avatar-7':case'avatar-8':case'avatar-9':PROFILES[profileIndex].avatar=AVATARS[Number(a.slice(7))];announce('Avatar atualizado para '+PROFILES[profileIndex].name+'.');render();break;
case'shortcut-media':case'shortcut-music':case'shortcut-photos':go('media');break;case'shortcut-weather':announce('Widget de clima: integração ainda não implementada.');break;case'shortcut-calendar':announce('Widget de calendário: integração ainda não implementada.');break;case'shortcut-marketplace':announce('Marketplace: catálogo e instalação ainda não implementados.');break;case'shortcut-demo':go('opening');break;
case'profile':go('profiles');break;
case'home-layout':homeLayout=(homeLayout+1)%HOME_LAYOUTS.length;announce('Layout da tela inicial: '+HOME_LAYOUTS[homeLayout]+'.');render();break;
case'tuner-cable':tuner='cable';announce('Origem selecionada: cabo.');render();break;case'tuner-satellite':tuner='satellite';announce('Origem selecionada: satélite.');render();break;case'tuner-digital':tuner='digital';announce('Origem selecionada: sinal digital terrestre.');render();break;
case'scan':announce('Busca simulada: não há sintonizador real conectado.');break;
case'motion':reducedMotion=!reducedMotion;announce('Redução de movimento '+(reducedMotion?'ativada':'desativada')+'.');render();break;
case'network':network=!network;announce(network?'Conectividade simulada como disponível.':'Modo sem rede simulado.');render();break;
case'sound':sound=!sound;announce('Sons da interface '+(sound?'ativados':'desativados')+'.');render();break;
case'language':announce('Outros idiomas ainda não foram implementados.');break;case'open-media':go('media');break;case'open-demo':go('opening');break;case'unavailable':announce('Este destino está indisponível nesta demonstração.');break;
case'retry':announce('A aplicação continua não instalada; retorno seguro disponível.');selected=0;render();break;
case'check-network':announce(network?'Verificação simulada: rede disponível.':'Verificação simulada: sem rede; recursos locais permanecem acessíveis.');break;
case'check-system':announce('Verificação simulada concluída: interface operacional.');break;
case'reset-ui':reducedMotion=false;network=true;sound=true;home();announce('Preferências da demonstração restauradas.');break}}
document.addEventListener('submit',e=>{if(e.target.id!=='profile-form')return;e.preventDefault();const name=document.querySelector('#profile-name-input')?.value.trim()||'',pin=document.querySelector('#profile-pin-input')?.value||'',confirmPin=document.querySelector('#profile-pin-confirm')?.value||'';if(!name){announce('Informe um nome para o perfil.');return}if(pin!==confirmPin){announce('Os PINs não coincidem.');document.querySelector('#profile-pin-confirm')?.focus();return}if(pin&&!/^[0-9]{4}$/.test(pin)){announce('Use um PIN de exatamente quatro dígitos.');return}PROFILES[profileIndex].name=name;PROFILES[profileIndex].avatar=editingAvatar;PROFILES[profileIndex].pin=pin;PROFILES[profileIndex].child=!!document.querySelector('#profile-child-input')?.checked;announce('Perfil salvo.');render()});
document.addEventListener('click',e=>{const t=e.target.closest('button[data-action]');if(!t)return;if(app.contains(t))selected=items().indexOf(t);act(t.dataset.action)});
document.addEventListener('keydown',e=>{const a=items();if(!a.length)return;if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Enter',' ','Escape','Backspace','Home'].includes(e.key)&&!(e.key===' '&&document.activeElement?.matches('input[type="checkbox"]')))e.preventDefault();
if(e.key==='h'||e.key==='H'||e.key==='Home'){home();return}if(e.key==='Escape'||e.key==='Backspace'){if(screen==='recovery'||screen==='about')go('settings');else if(screen==='profile-manage')home();else if(screen==='profile-unlock')go('profiles');else if(screen!=='home')home();return}
if(e.key==='Enter'||e.key===' '){const el=document.activeElement;if(el&&el.matches('button[data-action]'))act(el.dataset.action);else if(e.key==='Enter'&&el?.matches('input:not([type="checkbox"])'))el.form?.requestSubmit();return}
if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){const nav=[document.querySelector('#profile-button'),document.querySelector('.header-settings'),...a];const i=nav.indexOf(document.activeElement);const current=i<0?1:i;const next=findDirectionalIndex(nav,current,({ArrowRight:'right',ArrowLeft:'left',ArrowDown:'down',ArrowUp:'up'})[e.key]);nav[next].focus({preventScroll:screen!=='profile-manage'});selected=Math.max(0,items().indexOf(nav[next]))}});
if(new URLSearchParams(window.location.search).get('experience')==='tv'){document.body.classList.add('boot-mode');const boot=document.querySelector('#boot-screen');boot.hidden=false;window.setTimeout(()=>{boot.style.opacity='0';window.setTimeout(()=>{boot.hidden=true;document.body.classList.remove('boot-mode');render();focusSelected()},360)},1450)}else render()})();
</script></body></html>
