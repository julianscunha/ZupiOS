<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>ZupiOS — protótipo de interface 0.2</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#1a222d;--panel2:#242f3d;--text:#f4f7fb;--muted:#aebaca;--accent:#b9e46a;--line:#3a4859;--gold:#d7b45b;--gold-dark:#3a2e17;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:clamp(16px,1.35vw,22px);line-height:1.4}
button{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:16px 20px;min-height:60px;text-align:left;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent);outline-offset:4px}button:disabled{opacity:.48;cursor:not-allowed}
.shell{min-height:100vh;display:flex;flex-direction:column;padding:clamp(20px,3vw,46px);gap:24px;max-width:1600px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px}
.brand-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex-shrink:0}.brand{font-size:1.25em;font-weight:800;letter-spacing:.12em;line-height:1.1}.brand .z,.brand .os{color:var(--accent)}
.premium-band{background:linear-gradient(90deg,#9b7830,var(--gold),#f0d98d,var(--gold));color:#211a0b;border-radius:3px;padding:2px 10px;font-size:.58em;font-weight:900;letter-spacing:.22em;min-width:100%;text-align:center}
.top-meta{display:flex;align-items:center;justify-content:flex-end;gap:clamp(10px,2vw,26px);flex-wrap:wrap;color:var(--muted);font-size:.78em}
.meta-button{min-height:0;padding:8px 10px;border-radius:8px;font-size:inherit;background:transparent;white-space:nowrap}.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);font-size:1.15em}
main{flex:1;display:flex;flex-direction:column;gap:24px}.eyebrow{color:var(--accent);font-size:.72em;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(2rem,4.2vw,4rem);line-height:1.04;letter-spacing:-.035em;margin:6px 0 8px}h2{font-size:clamp(1.35rem,2.3vw,2.2rem);margin:0 0 8px}
p{color:var(--muted);max-width:66ch;margin:0}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:4px}
.tile{min-height:150px;display:flex;flex-direction:column;justify-content:space-between;background:var(--panel);padding:20px}.tile .glyph{font-size:1.8rem;color:var(--accent)}.tile strong{font-size:1.08em}.tile small{color:var(--muted);font-size:.75em}
.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:22px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column;gap:10px}.list button{display:flex;justify-content:space-between;align-items:center;gap:18px}.list button span:last-child{color:var(--muted);font-size:.8em}
.note{border-left:4px solid var(--accent);padding:12px 16px;background:#1c2a25;color:#eaf5dd}.actions{display:flex;gap:12px;flex-wrap:wrap}.primary{background:var(--accent);color:#15200b;border-color:var(--accent);font-weight:800}.quiet{background:transparent}
footer{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.72em}
.keys{display:flex;gap:7px;flex-wrap:wrap}.key{border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--text)}#toast{min-height:1.2em;color:var(--accent);font-size:.82em}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(max-width:900px){header{align-items:flex-start}.top-meta{max-width:65%}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.tile{min-height:130px}}
@media(max-width:540px){.shell{padding:16px}.top-meta{max-width:70%;gap:6px}.meta-button{white-space:normal}.tiles{grid-template-columns:1fr}.tile{min-height:110px;gap:10px}.clock{font-size:1em}}
</style></head>
<body><div class="shell">
<header>
  <div class="brand-wrap"><div class="brand"><span class="z">Z</span>UPI<span class="os">OS</span></div><div id="premium-band" class="premium-band" hidden>PREMIUM</div></div>
  <div class="top-meta"><span id="clock" class="clock" aria-label="Horário atual">--:--</span><button class="meta-button" data-action="profile" id="profile-button">Perfil: Principal ▾</button><span id="version">Protótipo v0.2.0</span></div>
</header>
<main id="app" aria-live="polite"></main><div id="toast" role="status" aria-live="polite"></div>
<footer><div class="keys"><span class="key">↑ ↓ ← →</span> navegar <span class="key">Enter</span> selecionar <span class="key">Esc</span> voltar <span class="key">H</span> início</div><span>Protótipo de interface · funções simuladas</span></footer>
</div>
<script>
(() => {
const APP_VERSION='0.2.0-prototype';
const EDITION='Premium'; // Mudar para 'Base' para ocultar a faixa dourada nesta demonstração.
const PROFILES=['Principal','Convidado'];
const app=document.querySelector('#app'),toast=document.querySelector('#toast');
let screen='home',selected=0,network=true,reducedMotion=false,sound=true,profileIndex=0,tuner='digital';
document.querySelector('#version').textContent='v'+APP_VERSION;
document.querySelector('#premium-band').hidden=EDITION.toLowerCase()!=='premium';
const items=()=>[...app.querySelectorAll('button:not(:disabled)')],announce=m=>toast.textContent=m,home=()=>go('home');
function updateClock(){const now=new Date();document.querySelector('#clock').textContent=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(now)}
updateClock();setInterval(updateClock,15000);
function go(s){screen=s;selected=0;render()}
function btn(label,action,cls=''){return '<button class="'+cls+'" data-action="'+action+'">'+label+'</button>'}
function focusSelected(){const a=items();if(a.length){selected=Math.max(0,Math.min(selected,a.length-1));a[selected].focus({preventScroll:true})}}
function render(){
document.body.classList.toggle('reduce-motion',reducedMotion);
document.querySelector('#profile-button').textContent='Perfil: '+PROFILES[profileIndex]+' ▾';
if(screen==='home')app.innerHTML='<section><div class="eyebrow">Menu principal</div><h1>O que você quer assistir?</h1></section><section class="tiles" aria-label="Menu principal">'+
'<button class="tile" data-action="tv"><span class="glyph">▣</span><strong>TV ao vivo</strong><small>Cabo · Satélite · Sinal digital</small></button>'+
'<button class="tile" data-action="apps"><span class="glyph">▦</span><strong>Aplicações</strong><small>Aplicativos instalados</small></button>'+
'<button class="tile" data-action="settings"><span class="glyph">⚙</span><strong>Configurações</strong><small>Sistema, perfis e ajuda</small></button>'+
'</section>';
else if(screen==='tv')app.innerHTML='<section><div class="eyebrow">Televisão</div><h1>TV ao vivo</h1><p>Selecione a origem do sinal. A sintonia e a reprodução dependem do sintonizador e das capacidades reconhecidas no dispositivo.</p></section><div class="layout"><section class="panel"><h2>Origem do sinal</h2><div class="list">'+btn('Cabo <span>'+(tuner==='cable'?'Selecionado':'Selecionar')+'</span>','tuner-cable')+btn('Satélite <span>'+(tuner==='satellite'?'Selecionado':'Selecionar')+'</span>','tuner-satellite')+btn('Sinal digital terrestre <span>'+(tuner==='digital'?'Selecionado':'Selecionar')+'</span>','tuner-digital')+'</div><div class="actions">'+btn('Buscar canais','scan','primary')+btn('Voltar ao menu','home','quiet')+'</div></section><aside class="panel"><h2>Estado</h2><p id="tuner-info">Origem escolhida: '+({cable:'Cabo',satellite:'Satélite',digital:'Sinal digital terrestre'}[tuner])+'.</p><div class="note">A busca de canais é apenas demonstrativa. Nenhum sintonizador real foi acessado.</div></aside></div>';
else if(screen==='settings')app.innerHTML='<section><div class="eyebrow">Menu / Sistema</div><h1>Configurações</h1><p>Preferências e ferramentas do sistema.</p></section><div class="layout"><section class="panel"><h2>Preferências</h2><div class="list">'+btn('Perfis de usuário <span>'+PROFILES[profileIndex]+'</span>','profile')+btn('Reduzir movimento <span>'+(reducedMotion?'Ativado':'Desativado')+'</span>','motion')+btn('Conectividade <span>'+(network?'Disponível':'Sem rede')+'</span>','network')+btn('Sons da interface <span>'+(sound?'Ativados':'Desativados')+'</span>','sound')+btn('Idioma <span>Português (Brasil)</span>','language')+'</div></section><aside class="panel"><h2>Sistema</h2><div class="list">'+btn('Ajuda e recuperação','recovery')+btn('Sobre o ZupiOS <span>v'+APP_VERSION+'</span>','about')+btn('Voltar ao menu principal','home','primary')+'</div><p>O relógio exibido usa a hora local do dispositivo. A configuração de fuso horário deve ocorrer durante a instalação do sistema.</p></aside></div>';
else if(screen==='apps')app.innerHTML='<section><div class="eyebrow">Biblioteca</div><h1>Aplicações</h1><p>Catálogo ilustrativo. Integração e instalação ainda não implementadas.</p></section><div class="layout"><section class="panel"><h2>Aplicações disponíveis</h2><div class="list">'+btn('Reprodutor de mídia <span>Demo</span>','open-media')+btn('Aplicação de exemplo <span>Demo</span>','open-demo')+btn('Serviço online <span>Indisponível</span>','unavailable')+'</div></section><aside class="panel"><h2>Aplicações</h2><p>A interface não instala nem executa aplicativos reais nesta versão.</p>'+btn('Voltar ao menu principal','home','primary')+'</aside></div>';
else if(screen==='media')app.innerHTML='<section><div class="eyebrow">Mídia</div><h1>Reprodutor de mídia</h1><p>Área de demonstração; nenhuma fonte de conteúdo foi conectada.</p></section><div class="panel"><p>Quando fontes compatíveis estiverem disponíveis, serão listadas aqui.</p>'+btn('Voltar às aplicações','apps','quiet')+btn('Voltar ao menu principal','home','primary')+'</div>';
else if(screen==='opening')app.innerHTML='<section><div class="eyebrow">Aplicações / Inicialização</div><h1>Não foi possível abrir</h1><p>A aplicação de demonstração não está instalada. O menu do sistema permanece disponível.</p></section><div class="panel"><div class="note">Nenhuma alteração foi feita no dispositivo.</div><div class="actions">'+btn('Tentar novamente','retry','primary')+btn('Voltar às aplicações','apps','quiet')+btn('Ir para o menu','home','quiet')+'</div></div>';
else if(screen==='recovery')app.innerHTML='<section><div class="eyebrow">Configurações / Sistema</div><h1>Ajuda e recuperação</h1><p>Ferramentas conceituais; nenhuma operação de firmware ou reparo é executada.</p></section><div class="layout"><section class="panel"><h2>Verificações</h2><div class="list">'+btn('Verificar conectividade <span>'+(network?'Disponível':'Sem rede')+'</span>','check-network')+btn('Estado do protótipo <span>Operacional</span>','check-system')+btn('Restaurar preferências desta demo','reset-ui')+'</div></section><aside class="panel"><h2>Recuperação segura</h2><p>Uma versão real deve validar o modelo e as capacidades do dispositivo antes de oferecer qualquer procedimento.</p>'+btn('Voltar às configurações','settings','primary')+'</aside></div>';
else if(screen==='about')app.innerHTML='<section><div class="eyebrow">Configurações / Sistema</div><h1>Sobre o ZupiOS</h1></section><div class="panel"><p>Versão da interface demonstrativa: '+APP_VERSION+'. Isso não representa uma versão publicada do sistema operacional.</p><p>Perfil atual: '+PROFILES[profileIndex]+'. Edição visual demonstrada: '+EDITION+'.</p>'+btn('Voltar às configurações','settings','primary')+'</div>';
focusSelected()}
function act(a){switch(a){
case'home':home();break;case'tv':go('tv');break;case'settings':go('settings');break;case'apps':go('apps');break;case'media':go('media');break;case'recovery':go('recovery');break;case'about':go('about');break;
case'profile':profileIndex=(profileIndex+1)%PROFILES.length;announce('Perfil ativo: '+PROFILES[profileIndex]+'. Perfis são simulados nesta demonstração.');render();break;
case'tuner-cable':tuner='cable';announce('Origem selecionada: cabo.');render();break;case'tuner-satellite':tuner='satellite';announce('Origem selecionada: satélite.');render();break;case'tuner-digital':tuner='digital';announce('Origem selecionada: sinal digital terrestre.');render();break;
case'scan':announce('Busca simulada: não há sintonizador real conectado.');break;
case'motion':reducedMotion=!reducedMotion;announce('Redução de movimento '+(reducedMotion?'ativada':'desativada')+'.');render();break;
case'network':network=!network;announce(network?'Conectividade simulada como disponível.':'Modo sem rede simulado.');render();break;
case'sound':sound=!sound;announce('Sons da interface '+(sound?'ativados':'desativados')+'.');render();break;
case'language':announce('Outros idiomas ainda não foram implementados.');break;case'open-media':go('media');break;case'open-demo':go('opening');break;case'unavailable':announce('Este destino está indisponível nesta demonstração.');break;
case'retry':announce('A aplicação continua não instalada; retorno seguro disponível.');selected=0;render();break;
case'check-network':announce(network?'Verificação simulada: rede disponível.':'Verificação simulada: sem rede; recursos locais permanecem acessíveis.');break;
case'check-system':announce('Verificação simulada concluída: interface operacional.');break;
case'reset-ui':reducedMotion=false;network=true;sound=true;home();announce('Preferências da demonstração restauradas.');break}}
document.addEventListener('click',e=>{const t=e.target.closest('button[data-action]');if(!t)return;if(app.contains(t))selected=items().indexOf(t);act(t.dataset.action)});
document.addEventListener('keydown',e=>{const a=items();if(!a.length)return;if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Enter',' ','Escape','Backspace','Home'].includes(e.key))e.preventDefault();
if(e.key==='h'||e.key==='H'||e.key==='Home'){home();return}if(e.key==='Escape'||e.key==='Backspace'){if(screen==='recovery'||screen==='about')go('settings');else if(screen!=='home')home();return}
if(e.key==='Enter'||e.key===' '){const el=document.activeElement;if(el&&el.matches('button[data-action]'))act(el.dataset.action);return}
if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){const i=a.indexOf(document.activeElement);selected=i<0?0:i;selected=(selected+((e.key==='ArrowDown'||e.key==='ArrowRight')?1:-1)+a.length)%a.length;focusSelected()}});
render()})();
</script></body></html>
