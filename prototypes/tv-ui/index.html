<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>ZupiOS — protótipo de interação v0</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#1a222d;--panel2:#242f3d;--text:#f4f7fb;--muted:#aebaca;--accent:#b9e46a;--line:#3a4859;--danger:#ffb6a9;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:clamp(16px,1.4vw,22px);line-height:1.4}
button{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:16px 20px;min-height:60px;text-align:left;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent);outline-offset:4px}button:disabled{opacity:.48;cursor:not-allowed}
.shell{min-height:100vh;display:flex;flex-direction:column;padding:clamp(22px,4vw,64px);gap:28px;max-width:1600px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}
.brand{font-size:1.2em;font-weight:800;letter-spacing:.12em}.brand span{color:var(--accent)}.status{color:var(--muted);font-size:.8em;display:flex;gap:16px;flex-wrap:wrap}
main{flex:1;display:flex;flex-direction:column;gap:26px}.eyebrow{color:var(--accent);font-size:.72em;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(2.2rem,5vw,4.8rem);line-height:1.03;letter-spacing:-.04em;margin:8px 0 10px}h2{font-size:clamp(1.5rem,2.5vw,2.5rem);margin:0 0 8px}
p{color:var(--muted);max-width:66ch;margin:0}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:8px}
.tile{min-height:190px;display:flex;flex-direction:column;justify-content:space-between;background:var(--panel);padding:22px}.tile .glyph{font-size:2rem;color:var(--accent)}.tile strong{font-size:1.12em}.tile small{color:var(--muted);font-size:.75em}
.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:28px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column;gap:10px}.list button{display:flex;justify-content:space-between;align-items:center;gap:18px}.list button span:last-child{color:var(--muted);font-size:.8em}
.note{border-left:4px solid var(--accent);padding:12px 16px;background:#1c2a25;color:#eaf5dd}.actions{display:flex;gap:12px;flex-wrap:wrap}.primary{background:var(--accent);color:#15200b;border-color:var(--accent);font-weight:800}.quiet{background:transparent}
footer{border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.76em}
.keys{display:flex;gap:8px;flex-wrap:wrap}.key{border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--text)}#toast{min-height:1.4em;color:var(--accent);font-size:.85em}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.tile{min-height:140px}}@media(max-width:520px){.tiles{grid-template-columns:1fr}.shell{padding:20px}.status{display:none}}
</style></head>
<body><div class="shell">
<header><div class="brand"><span>Z</span>UPI<span>OS</span></div><div class="status"><span id="network">● Rede disponível</span><span>Protótipo exploratório</span></div></header>
<main id="app" aria-live="polite"></main><div id="toast" role="status" aria-live="polite"></div>
<footer><div class="keys"><span class="key">↑ ↓ ← →</span> navegar <span class="key">Enter</span> selecionar <span class="key">Esc</span> voltar <span class="key">H</span> início</div><span>Interface demonstrativa · sem serviços reais</span></footer>
</div>
<script>
(() => {
const app=document.querySelector('#app'),toast=document.querySelector('#toast');let screen='home',selected=0,network=true,reducedMotion=false,sound=true;
const items=()=>[...app.querySelectorAll('button:not(:disabled)')],announce=m=>toast.textContent=m,home=()=>go('home');
function go(s){screen=s;selected=0;render()}
function btn(label,action,cls=''){return '<button class="'+cls+'" data-action="'+action+'">'+label+'</button>'}
function focusSelected(){const a=items();if(a.length){selected=Math.max(0,Math.min(selected,a.length-1));a[selected].focus({preventScroll:true})}}
function render(){
document.body.classList.toggle('reduce-motion',reducedMotion);document.querySelector('#network').textContent=network?'● Rede disponível':'● Sem rede';
if(screen==='home')app.innerHTML='<section><div class="eyebrow">Sua TV, sem excesso</div><h1>O essencial.<br>Sem espera.</h1><p>Um ponto de partida simples para aplicações, mídia e configurações. Navegue apenas com as setas e o botão OK.</p></section><section class="tiles" aria-label="Destinos principais"><button class="tile" data-action="media"><span class="glyph">▶</span><strong>Mídia</strong><small>Conteúdo e reprodução</small></button><button class="tile" data-action="apps"><span class="glyph">▦</span><strong>Aplicações</strong><small>Seus destinos</small></button><button class="tile" data-action="settings"><span class="glyph">⚙</span><strong>Configurações</strong><small>Preferências do sistema</small></button><button class="tile" data-action="recovery"><span class="glyph">↻</span><strong>Ajuda e recuperação</strong><small>Diagnóstico e retorno seguro</small></button></section><div class="note">A interface continua navegável sem rede. Imagens, previews e animações não são necessários para as ações básicas.</div>';
else if(screen==='settings')app.innerHTML='<section><div class="eyebrow">Sistema / Preferências</div><h1>Configurações</h1><p>Opções demonstrativas; alterações afetam somente este protótipo.</p></section><div class="layout"><section class="panel"><h2>Preferências</h2><div class="list">'+btn('Reduzir movimento <span>'+(reducedMotion?'Ativado':'Desativado')+'</span>','motion')+btn('Conectividade <span>'+(network?'Disponível':'Sem rede')+'</span>','network')+btn('Sons da interface <span>'+(sound?'Ativados':'Desativados')+'</span>','sound')+btn('Idioma <span>Português (Brasil)</span>','language')+'</div></section><aside class="panel"><h2>Estado do sistema</h2><p>Foco visível, navegação por teclado/controle remoto e layout adaptável são prioridades deste estudo.</p><div class="note">Nenhuma preferência inicia serviços em segundo plano neste protótipo.</div>'+btn('Voltar à Home','home','primary')+'</aside></div>';
else if(screen==='apps')app.innerHTML='<section><div class="eyebrow">Biblioteca</div><h1>Aplicações</h1><p>Catálogo ilustrativo. Integração e instalação ainda não implementadas.</p></section><div class="layout"><section class="panel"><h2>Disponíveis para demonstração</h2><div class="list">'+btn('Reprodutor de mídia <span>Demo</span>','open-media')+btn('Aplicação de exemplo <span>Demo</span>','open-demo')+btn('Serviço online <span>Indisponível</span>','unavailable')+'</div></section><aside class="panel"><h2>Comportamento esperado</h2><p>A seleção dá feedback imediato. Uma falha deve explicar o problema e oferecer nova tentativa ou retorno claro.</p>'+btn('Voltar à Home','home','primary')+'</aside></div>';
else if(screen==='media')app.innerHTML='<section><div class="eyebrow">Mídia</div><h1>Escolha o conteúdo</h1><p>Sem reprodução automática. O catálogo só aparece quando solicitado.</p></section><div class="layout"><section class="panel"><h2>Fontes</h2><div class="list">'+btn('Arquivos locais <span>Não conectado</span>','unavailable')+btn('Biblioteca de demonstração <span>Exemplo</span>','open-media')+'</div></section><aside class="panel"><h2>Modo leve</h2><p>Sem rede ou fonte de conteúdo, a tela continua estável e permite retornar à Home.</p>'+btn('Voltar à Home','home','primary')+'</aside></div>';
else if(screen==='opening')app.innerHTML='<section><div class="eyebrow">Aplicações / Inicialização</div><h1>Não foi possível abrir</h1><p>A aplicação de demonstração não está instalada. A navegação do sistema permanece disponível.</p></section><div class="layout"><section class="panel"><h2>Aplicação indisponível</h2><p>Estado simulado para validar falhas sem travar a interface.</p><div class="note">Nenhuma alteração foi feita no dispositivo.</div><div class="actions">'+btn('Tentar novamente','retry','primary')+btn('Voltar às aplicações','apps','quiet')+btn('Ir para Home','home','quiet')+'</div></section><aside class="panel"><h2>Tratamento de falha</h2><p>Mensagem clara, ação possível e foco preservado são requisitos básicos.</p></aside></div>';
else if(screen==='recovery')app.innerHTML='<section><div class="eyebrow">Sistema / Diagnóstico</div><h1>Ajuda e recuperação</h1><p>Fluxo conceitual de recuperação. Não executa reparos, atualizações ou operações de firmware.</p></section><div class="layout"><section class="panel"><h2>Verificações seguras</h2><div class="list">'+btn('Verificar conectividade <span>'+(network?'Rede disponível':'Sem rede')+'</span>','check-network')+btn('Estado do protótipo <span>Operacional</span>','check-system')+btn('Restaurar interface de demonstração','reset-ui')+'</div></section><aside class="panel"><h2>Antes de qualquer recuperação</h2><p>Uma implementação real precisa detectar capacidades do dispositivo, explicar riscos e oferecer somente caminhos validados para o hardware.</p>'+btn('Voltar à Home','home','primary')+'</aside></div>';
focusSelected()}
function act(a){switch(a){
case'home':home();break;case'settings':go('settings');break;case'apps':go('apps');break;case'media':go('media');break;case'recovery':go('recovery');break;
case'motion':reducedMotion=!reducedMotion;announce('Redução de movimento '+(reducedMotion?'ativada':'desativada')+'.');render();break;
case'network':network=!network;announce(network?'Conectividade simulada como disponível.':'Modo sem rede simulado.');render();break;
case'sound':sound=!sound;announce('Sons da interface '+(sound?'ativados':'desativados')+'.');render();break;
case'language':announce('Outros idiomas ainda não foram implementados.');break;case'open-media':go('media');announce('Área de mídia aberta.');break;case'open-demo':go('opening');break;case'unavailable':announce('Este destino está indisponível nesta demonstração.');break;
case'retry':announce('A aplicação continua não instalada; retorno seguro disponível.');selected=0;render();break;
case'check-network':announce(network?'Verificação simulada: rede disponível.':'Verificação simulada: sem rede; recursos locais permanecem acessíveis.');break;
case'check-system':announce('Verificação simulada concluída: interface operacional.');break;case'reset-ui':reducedMotion=false;network=true;sound=true;home();announce('Preferências da demonstração restauradas.');break}}
app.addEventListener('click',e=>{const t=e.target.closest('button[data-action]');if(!t)return;selected=items().indexOf(t);act(t.dataset.action)});
document.addEventListener('keydown',e=>{const a=items();if(!a.length)return;if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Enter',' ','Escape','Backspace','Home'].includes(e.key))e.preventDefault();
if(e.key==='h'||e.key==='H'||e.key==='Home'){home();return}if(e.key==='Escape'||e.key==='Backspace'){if(screen!=='home')home();return}
if(e.key==='Enter'||e.key===' '){const el=document.activeElement;if(el&&el.matches('button[data-action]'))act(el.dataset.action);return}
if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){const i=a.indexOf(document.activeElement);selected=i<0?0:i;selected=(selected+((e.key==='ArrowDown'||e.key==='ArrowRight')?1:-1)+a.length)%a.length;focusSelected()}});
render()})();
</script></body></html>
